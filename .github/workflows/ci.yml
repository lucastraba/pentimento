name: ci
on:
  push:
    # Branches only. A bare `push` also fires on tag pushes, which would rerun
    # the whole matrix alongside the release workflow.
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the floor in package.json (and pnpm 11's own); the package
        # job below proves the published CLI on it.
        node: [22.13.0, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: node dist/cli.js verify .

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install and exercise the packed package
        run: |
          package=$(npm pack --silent)
          mkdir "$RUNNER_TEMP/pentimento-smoke"
          cd "$RUNNER_TEMP/pentimento-smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$package"
          ./node_modules/.bin/pentimento --version
          printf '# Package smoke test\n' > Plan.md
          ./node_modules/.bin/pentimento snapshot Plan.md --summary 'Initial version'
          ./node_modules/.bin/pentimento render Plan.md
          ./node_modules/.bin/pentimento verify .
