name: ci
on:
  push:
    # Branches only. A bare `push` also fires on tag pushes, which would rerun
    # the whole matrix alongside the release workflow.
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the oldest Node the vitest/rolldown toolchain runs on; the
        # package job below still proves the published CLI on the 20.13 floor.
        node: [20.19.0, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node dist/cli.js verify .

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.13.0
      - run: npm ci
      - run: npm run build
      - name: Install and exercise the packed package
        run: |
          package=$(npm pack --silent)
          mkdir "$RUNNER_TEMP/pentimento-smoke"
          cd "$RUNNER_TEMP/pentimento-smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$package"
          ./node_modules/.bin/pentimento --version
          printf '# Package smoke test\n' > Plan.md
          ./node_modules/.bin/pentimento snapshot Plan.md --summary 'Initial version'
          ./node_modules/.bin/pentimento render Plan.md
          ./node_modules/.bin/pentimento verify .

  obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Build the Obsidian plugin and walk it through a draft cycle
        working-directory: obsidian
        run: |
          npm ci
          npm run build
          node test/harness.mjs
