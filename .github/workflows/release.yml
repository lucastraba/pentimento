name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node 22.14+ / npm 11.5.1+, well above the
          # >=20.13 floor the package itself supports.
          node-version: 24
      # No registry-url on setup-node: it writes an _authToken line that expands
      # to empty, which makes npm skip the OIDC handshake entirely.
      # https://github.com/actions/setup-node/issues/1551

      - name: Check the tag matches package.json
        run: |
          tag=${GITHUB_REF_NAME#v}
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node dist/cli.js verify .

      - run: npm publish
